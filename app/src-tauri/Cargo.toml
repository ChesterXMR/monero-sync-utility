[package]
name = "monero-sync"
version = "1.0.0"
description = "Keeps a Monero blockchain synced on a schedule, then shuts monerod down gracefully"
edition = "2021"


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_Security"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
